<!DOCTYPE html>
<!--
  Camp HR Portal — Sign-In Page
  ============================================================================
  This page is hosted on GitHub Pages (e.g., https://YOUR-CAMP-hr.github.io)
  and embedded as an iframe inside the Apps Script portal.

  Why this exists:
    Google Identity Services cannot run inside Apps Script's sandboxed iframe
    because the iframe lacks the 'identity-credentials-get' permission. By
    serving this page from a real top-level origin (GitHub Pages), GIS works
    normally. We then forward the signed credential to the parent (Apps Script)
    via postMessage.

  Security model:
    - This page never validates the JWT; it just relays the raw signed token
    - The parent (Apps Script) verifies the JWT server-side via Google's
      tokeninfo endpoint before trusting any email claim
    - postMessage uses a pinned origin to prevent token harvesting by other
      embedding sites

  Setup:
    1. Edit CONFIG below with this camp's CLIENT_ID and CAMP_NAME
    2. Push to a GitHub repo named e.g. YOUR-CAMP-hr
    3. Enable GitHub Pages on that repo (main branch, root)
    4. Add https://YOUR-CAMP-hr.github.io to the GCP OAuth client's
       authorized JavaScript origins
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Camp HR Portal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent;
      color: #1f2937;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px;
      gap: 12px;
      text-align: center;
      max-width: 100%;
    }
    .brand-mark {
      font-size: 32px;
      line-height: 1;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #111827;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
      max-width: 300px;
      line-height: 1.45;
    }
    .button-host {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .footnote {
      font-size: 11px;
      color: #9ca3af;
      max-width: 320px;
      line-height: 1.35;
      margin-top: 4px;
    }
    #status {
      font-size: 12px;
      color: #047857;
      min-height: 0;
    }
    #error {
      font-size: 12px;
      color: #dc2626;
      min-height: 0;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img id="brandLogo" class="brand-mark brand-logo"
         src=""
         alt=""
         style="display:none"
         onerror="this.style.display='none'; document.getElementById('brandEmoji').style.display='';">
    <div id="brandEmoji" class="brand-mark">🏕️</div>
    <h1 id="campTitle">Camp HR Portal</h1>
    <p>Sign in with your Google account to access your HR forms.</p>
    <div class="button-host" id="buttonHost"></div>
    <div id="status"></div>
    <div id="error"></div>
    <div class="footnote">Your sign-in is verified securely. We only read your email address.</div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // ========================================================================
    // CAMP-SPECIFIC CONFIG — edit per camp deployment
    // ========================================================================
    const CONFIG = {
      // From Google Cloud Console → APIs & Services → Credentials → OAuth 2.0
      // Client IDs → Web application → Client ID
      CLIENT_ID: '704519393690-22r514v94kf4nf6kfjq0rt5t7pjb8lrt.apps.googleusercontent.com',

      // Display name shown on this page
      CAMP_NAME: 'BR Day Camp',

      // Optional camp/school logo URL. Leave empty string to fall back to emoji.
      CAMP_LOGO_URL: 'https://mashpia.com/schoolLogos/schoolLogos/Bais%20Rivkah%20of%20Crown%20Heights.png'
    };

    // Set the title and logo from config
    document.getElementById('campTitle').textContent = CONFIG.CAMP_NAME;
    if (CONFIG.CAMP_LOGO_URL) {
      const img = document.getElementById('brandLogo');
      img.src = CONFIG.CAMP_LOGO_URL;
      img.style.display = '';
      document.getElementById('brandEmoji').style.display = 'none';
    }

    // ========================================================================
    // STORAGE RELAY
    // ========================================================================
    // The Apps Script web app runs in a googleusercontent.com sandbox whose
    // subdomain rotates periodically. localStorage is scoped to origin, so the
    // user's session token disappears whenever the subdomain changes.
    //
    // This page lives at a stable GitHub Pages origin. By embedding it in the
    // parent and using postMessage, we can read/write a session token at this
    // stable origin so it survives subdomain rotation.
    //
    // Protocol (all messages namespaced with "hr-portal:"):
    //   Parent → here:  { type: 'hr-portal:get-token', requestId }
    //   Here → parent:  { type: 'hr-portal:token-response', requestId, token, expiresAt }
    //   Parent → here:  { type: 'hr-portal:set-token', requestId, token, expiresAt }
    //   Here → parent:  { type: 'hr-portal:set-token-ack', requestId, ok }
    //   Parent → here:  { type: 'hr-portal:clear-token', requestId }
    //   Here → parent:  { type: 'hr-portal:clear-token-ack', requestId, ok }
    //
    // Security: we only respond to messages from the parent window (we don't
    // serve other embedders), and we send responses back to event.source with
    // event.origin as the target so the response can't be intercepted.

    const STORAGE_KEY = 'hr-portal-session-token';
    const STORAGE_EXPIRY_KEY = 'hr-portal-session-expires';

    function readStoredToken() {
      try {
        const token = localStorage.getItem(STORAGE_KEY);
        const expiresAt = parseInt(localStorage.getItem(STORAGE_EXPIRY_KEY) || '0', 10);
        if (!token || !expiresAt) return { token: null, expiresAt: 0 };
        if (Date.now() >= expiresAt) {
          // Expired — clean it up
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_EXPIRY_KEY);
          return { token: null, expiresAt: 0 };
        }
        return { token, expiresAt };
      } catch (e) {
        return { token: null, expiresAt: 0 };
      }
    }

    function writeStoredToken(token, expiresAt) {
      try {
        localStorage.setItem(STORAGE_KEY, token);
        localStorage.setItem(STORAGE_EXPIRY_KEY, String(expiresAt));
        return true;
      } catch (e) {
        return false;
      }
    }

    function clearStoredToken() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_EXPIRY_KEY);
        return true;
      } catch (e) {
        return false;
      }
    }

    window.addEventListener('message', function(event) {
      // Only respond to messages from our parent window
      if (event.source !== window.parent) return;

      const d = event.data;
      if (!d || typeof d.type !== 'string') return;
      if (d.type.indexOf('hr-portal:') !== 0) return;

      const requestId = d.requestId || null;
      const respond = (payload) => {
        // Reply back to the same origin that sent us the message
        event.source.postMessage(
          Object.assign({ requestId }, payload),
          event.origin
        );
      };

      switch (d.type) {
        case 'hr-portal:get-token': {
          const { token, expiresAt } = readStoredToken();
          respond({ type: 'hr-portal:token-response', token, expiresAt });
          break;
        }
        case 'hr-portal:set-token': {
          const ok = writeStoredToken(d.token, d.expiresAt);
          respond({ type: 'hr-portal:set-token-ack', ok });
          break;
        }
        case 'hr-portal:clear-token': {
          const ok = clearStoredToken();
          respond({ type: 'hr-portal:clear-token-ack', ok });
          break;
        }
      }
    });

    // Announce to the parent that we're ready to receive storage requests.
    // (The parent waits for this before sending any get-token query.)
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'hr-portal:ready' }, '*');
    }

    // ========================================================================
    // GIS init & callback
    // ========================================================================
    function handleCredentialResponse(response) {
      try {
        if (!response || !response.credential) {
          showError('No credential returned from Google.');
          return;
        }
        showStatus('Verifying…');

        // Forward the RAW signed JWT to the parent (Apps Script).
        // The parent will validate it server-side via Google's tokeninfo endpoint.
        // We never trust or decode it here.
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'hr-portal:signin-complete',
            credential: response.credential
          }, '*');
        } else {
          showError('This page must be loaded inside the portal.');
        }
      } catch (err) {
        showError('Sign-in failed: ' + (err && err.message ? err.message : String(err)));
      }
    }

    function initGIS() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        // GIS library not yet loaded — try again shortly
        setTimeout(initGIS, 100);
        return;
      }

      if (CONFIG.CLIENT_ID.indexOf('PASTE_') === 0) {
        showError('Sign-in not configured. CLIENT_ID is missing.');
        return;
      }

      google.accounts.id.initialize({
        client_id: CONFIG.CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true,
        use_fedcm_for_prompt: true
      });

      google.accounts.id.renderButton(
        document.getElementById('buttonHost'),
        {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: 240
        }
      );
    }

    function showStatus(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('error').textContent = '';
    }
    function showError(msg) {
      document.getElementById('error').textContent = msg;
      document.getElementById('status').textContent = '';
    }

    // Wait until the GIS library has loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGIS);
    } else {
      initGIS();
    }
  </script>
</body>
</html>
